<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{title}}</title>

  <!-- Reveal.js core -->
  <link rel="stylesheet" href="{{revealjs-url}}/dist/reset.css">
  <link rel="stylesheet" href="{{revealjs-url}}/dist/reveal.css">
  <link rel="stylesheet" href="{{revealjs-url}}/dist/theme/{{theme}}.css" id="theme">

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="{{revealjs-url}}/plugin/highlight/monokai.css">

  <!-- Global styles (shared by all decks) -->
  <link rel="stylesheet" href="{{root}}/_templates/custom.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <!--
        Slides are loaded from slides.md at runtime via the RevealMarkdown plugin.
        Use --- for horizontal separators and -- for vertical separators.
        Use Notes: at the end of a slide to add speaker notes.

        For a static build (no server required), run:
          npm run build
        which uses Pandoc to generate a self-contained index-static.html.
      -->
      <section
        data-markdown="slides.md"
        data-separator="^\n---\n"
        data-separator-vertical="^\n--\n"
        data-separator-notes="^Notes:"
        data-charset="utf-8">
      </section>
    </div>
  </div>

  <!-- Reveal.js scripts -->
  <script src="{{revealjs-url}}/dist/reveal.js"></script>
  <script src="{{revealjs-url}}/plugin/markdown/markdown.js"></script>
  <script src="{{revealjs-url}}/plugin/highlight/highlight.js"></script>
  <script src="{{revealjs-url}}/plugin/notes/notes.js"></script>
  <script src="{{revealjs-url}}/plugin/search/search.js"></script>
  <script src="{{revealjs-url}}/plugin/zoom/zoom.js"></script>

  <script>
    Reveal.initialize({
      hash: true,
      history: false,
      controls: true,
      progress: true,
      center: true,
      transition: '{{transition}}',
      backgroundTransition: 'fade',
      plugins: [
        RevealMarkdown,
        RevealHighlight,
        RevealNotes,
        RevealSearch,
        RevealZoom
      ]
    });
  </script>
</body>
</html>
