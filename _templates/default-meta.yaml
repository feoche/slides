# ─── Pandoc / Reveal.js shared defaults ─────────────────────────────────────
# This file is passed to every `pandoc` build via --metadata-file.
# Override any value in a deck's own YAML front matter block.
#
# Global CSS (_templates/custom.css) is loaded automatically by the template —
# no css: entry needed here.  Per-deck extra CSS:
#   css: ["assets/my-overrides.css"]

# ── Reveal.js source ─────────────────────────────────────────────────────────
# CDN (default) — works anywhere with internet. Change to a relative path such
# as "../node_modules/reveal.js" for fully offline builds.
revealjs-url: "https://cdn.jsdelivr.net/npm/reveal.js@5"

# ── Theme & transitions ──────────────────────────────────────────────────────
# Built-in themes: black white league beige sky night serif simple solarized
# moon dracula blood seti
theme: black
transition: slide           # none | fade | slide | convex | concave | zoom
transitionSpeed: default    # default | fast | slow
backgroundTransition: fade  # none | fade | slide | convex | concave | zoom

# ── Navigation & URL ────────────────────────────────────────────────────────
hash: true          # update URL hash on slide change
history: false      # push history entries (conflicts with hash: true)
keyboard: true
overview: true      # Esc to toggle overview mode
center: true        # vertical centering of slides
touch: true
loop: false
rtl: false
navigationMode: default   # default | linear | grid
shuffle: false
fragments: true
fragmentInURL: true

# ── UI elements ─────────────────────────────────────────────────────────────
controls: true
controlsTutorial: true
controlsLayout: bottom-right    # edges | bottom-right
controlsBackArrows: faded       # faded | hidden | visible
progress: true
slideNumber: false   # false | true | "c/t" | "c" | "t" | "h/v" | "h.v"
showSlideNumber: all # all | print | speaker
showNotes: false

# ── Auto-slide ───────────────────────────────────────────────────────────────
autoSlide: 0          # ms between slides (0 = disabled)
autoSlideStoppable: true

# ── PDF export ───────────────────────────────────────────────────────────────
pdfSeparateFragments: true
pdfMaxPagesPerSlide: 1

# ── Misc ─────────────────────────────────────────────────────────────────────
mouseWheel: false
previewLinks: false
hideInactiveCursor: true
hideCursorTime: 5000
disableLayout: false

# ── Syntax highlighting (reveal.js plugin) ───────────────────────────────────
# Uncomment to use highlight.js instead of Pandoc's built-in highlighting.
# highlightjs: monokai   # monokai | zenburn | atom-one-dark | etc.


